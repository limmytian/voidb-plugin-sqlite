id = "sqlite"
name = "SQLite Database Plugin"
version = "0.3.3"
protocol_version = "1"
description = "SQLite embedded database process plugin for VoidB."
license = "Apache-2.0"
homepage = "https://github.com/limmytian/voidb-plugin-sqlite"

[runtime]
command = "voidb-plugin-sqlite"
args = ["serve"]
transport = "stdio-jsonrpc"

[connections]
profile_schema = "schemas/profile.schema.json"
secret_classes = []

[[capabilities]]
id = "query"
description = "Execute read-oriented SQL and return row sets."
input_schema = "schemas/query-input.schema.json"
output_schema = "schemas/query-output.schema.json"
permissions = ["connection.read", "sql.query"]
risk = "read_only"
destructive = false
streaming = false
connection_required = true
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "explain"
description = "Inspect the query plan for one read-oriented SQLite SQL statement."
input_schema = "schemas/explain-input.schema.json"
output_schema = "schemas/explain-output.schema.json"
permissions = ["connection.read", "sql.explain"]
risk = "read_only"
destructive = false
streaming = false
connection_required = true
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "exec"
description = "Execute SQL that may mutate schema or data."
input_schema = "schemas/exec-input.schema.json"
output_schema = "schemas/exec-output.schema.json"
permissions = ["connection.read", "sql.exec"]
risk = "destructive"
destructive = true
streaming = false
connection_required = true
supports_dry_run = true
default_timeout_ms = 30000

[[capabilities]]
id = "catalogs"
description = "List the SQLite database and schema catalog."
input_schema = "schemas/catalogs-input.schema.json"
output_schema = "schemas/catalogs-output.schema.json"
permissions = ["connection.read", "schema.list"]
risk = "read_only"
destructive = false
streaming = false
connection_required = true
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "tables"
description = "List SQLite tables and views."
input_schema = "schemas/tables-input.schema.json"
output_schema = "schemas/tables-output.schema.json"
permissions = ["connection.read", "schema.list"]
risk = "read_only"
destructive = false
streaming = false
connection_required = true
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "describe_table"
description = "Describe SQLite table columns, indexes, and foreign keys."
input_schema = "schemas/describe_table-input.schema.json"
output_schema = "schemas/describe_table-output.schema.json"
permissions = ["connection.read", "schema.describe"]
risk = "read_only"
destructive = false
streaming = false
connection_required = true
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "export_query"
description = "Export one bounded SQLite query page as CSV, JSON, or JSONL."
input_schema = "schemas/export_query-input.schema.json"
output_schema = "schemas/export_query-output.schema.json"
permissions = ["connection.read", "sql.export", "local.write"]
risk = "read_only"
destructive = false
streaming = true
connection_required = true
supports_dry_run = false
default_timeout_ms = 60000

[[capabilities]]
id = "import_plan"
description = "Preview one bounded SQLite import batch from an approved local source."
input_schema = "schemas/import_plan-input.schema.json"
output_schema = "schemas/import_plan-output.schema.json"
permissions = ["connection.read", "sql.import.plan", "local.read"]
risk = "read_only"
destructive = false
streaming = false
connection_required = true
supports_dry_run = false
default_timeout_ms = 60000

[[capabilities]]
id = "import_apply"
description = "Apply one acknowledged SQLite import batch from an approved local source."
input_schema = "schemas/import_apply-input.schema.json"
output_schema = "schemas/import_apply-output.schema.json"
permissions = ["connection.read", "sql.import.apply", "local.read"]
risk = "destructive"
destructive = true
streaming = false
connection_required = true
supports_dry_run = true
default_timeout_ms = 60000

