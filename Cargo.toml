[package]
name = "voidb-plugin-sqlite"
version = "0.3.3"
edition = "2024"
license = "Apache-2.0"
authors = ["limmytian <limmytian@gmail.com>"]
description = "Standalone VoidB process plugin for SQLite"
repository = "https://github.com/limmytian/voidb-plugin-sqlite"

[[bin]]
name = "voidb-plugin-sqlite"
path = "src/main.rs"

[dependencies]
voidb-process-plugin-sdk = { git = "https://github.com/limmytian/voidb.git", rev = "31d22cd09c9b10f1d22f59d47e789a49c33a290d" }
voidb-core = { git = "https://github.com/limmytian/voidb.git", rev = "31d22cd09c9b10f1d22f59d47e789a49c33a290d", default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json", "uuid"] }
async-trait = "0.1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.43", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"

[dev-dependencies]
toml = "0.8"
